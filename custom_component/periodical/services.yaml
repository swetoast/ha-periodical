get_schedule_date:
  name: Get schedule for date
  description: Fetch the schedule for a specific date and fire a periodical_schedule_date event with the result.
  fields:
    date:
      name: Date
      description: The date to fetch (YYYY-MM-DD).
      required: true
      selector:
        date:

get_schedule_week:
  name: Get schedule for week
  description: Fetch the schedule for the ISO week containing the given date and fire a periodical_schedule_week event.
  fields:
    date:
      name: Date
      description: Any date within the desired ISO week (YYYY-MM-DD).
      required: true
      selector:
        date:

get_schedule_range:
  name: Get schedule for range
  description: Fetch the schedule for a date range (max 70 days) and fire a periodical_schedule_range event.
  fields:
    from_date:
      name: From date
      description: Start of the range (YYYY-MM-DD).
      required: true
      selector:
        date:
    to_date:
      name: To date
      description: End of the range (YYYY-MM-DD).
      required: true
      selector:
        date:

get_pay_month:
  name: Get monthly pay
  description: Fetch the pay summary for a month and fire a periodical_pay_month event.
  fields:
    year:
      name: Year
      description: Year (defaults to current year).
      required: false
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
    month:
      name: Month
      description: Month 1-12 (defaults to current month).
      required: false
      selector:
        number:
          min: 1
          max: 12
          mode: box

get_vacation_balance:
  name: Get vacation balance
  description: Fetch the vacation balance for a year and fire a periodical_vacation_balance event.
  fields:
    year:
      name: Year
      description: Year (defaults to current year).
      required: false
      selector:
        number:
          min: 2000
          max: 2100
          mode: box
